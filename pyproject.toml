[project]
name = "loose-version-comparator"
version = "0.1.0"
description = "Compares version strings that do not follow any strict spec by splitting on non-numeric boundaries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
